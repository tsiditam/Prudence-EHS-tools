name: AtmosFlow CI

# The gate that was missing when 24 extension-less imports took every
# affected /api route to 500 "since it was deployed" (see CHANGELOG).
# Nothing else runs AtmosFlow's typecheck, lint, tests or build before a
# merge — Vercel runs `vite build` only. Require the `test` and `api-boot`
# jobs in branch protection on main.

on:
  pull_request:
    paths:
      - 'atmosiq-v6/**'
      - '.github/workflows/atmosflow-ci.yml'
  push:
    branches: [main]
    paths:
      - 'atmosiq-v6/**'
      - '.github/workflows/atmosflow-ci.yml'

concurrency:
  group: atmosflow-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: atmosiq-v6

jobs:
  test:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atmosiq-v6/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (infra paths at zero warnings; src/ under the ratchet)
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

  api-boot:
    # Bundles every api/** entry with esbuild the way Vercel's Node runtime
    # would see it and imports the output under plain Node. This is the
    # runtime shape the test suite cannot see (vitest resolves extension-less
    # .ts imports that Node ESM refuses) — the CHANGELOG incident in one job.
    name: api handlers boot under plain Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atmosiq-v6/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bundle + import every api/** entry
        run: npm run accept:api-boot

      - name: Container bundle (server/handlers/*.mjs) builds
        run: npm run bundle:api

  accept-prod-ready:
    # The full acceptance gate. Runs the test suite once more (BUILD-02),
    # so it is a separate job that only starts once `test` is green.
    name: accept:prod-ready
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atmosiq-v6/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production-readiness acceptance gate
        run: npm run accept:prod-ready
