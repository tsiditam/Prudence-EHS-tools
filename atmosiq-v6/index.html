<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: pinch-zoom must stay available
         (WCAG 2.1 SC 1.4.4 Resize text). iOS auto-zoom on focus is prevented
         by the 16px input floor below, not by locking the viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches --bg for the default (dark) theme. src/utils/theme.js
         rewrites this to the live --bg whenever the theme changes, so the
         iOS status-bar / safe-area tint follows light mode instead of
         staying dark. -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AtmosFlow" />
    <meta name="description" content="Field-grade IAQ assessment platform by Prudence EHS. Real-time scoring, causal analysis, and defensible reports." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>AtmosFlow — by Prudence EHS</title>
    <style>
      html,body{
        margin:0;
        background:#1C1B19;
        /* Lock the mobile viewport: no rubber-band bounce when the
           user scrolls past the top/bottom edge, no horizontal
           overflow that lets the page slide sideways, and no
           double-tap zoom. Combined with the 16px input font rule
           below, the page never "expands" on phone by accident — it
           only scrolls vertically within its own content. Deliberate
           pinch-zoom is still allowed (the viewport meta no longer
           locks scale — WCAG 2.1 SC 1.4.4). */
        overscroll-behavior:none;
        overflow-x:hidden;
        touch-action:pan-y;
        -webkit-text-size-adjust:100%;
        text-size-adjust:100%;
      }
      /* iOS Safari auto-zooms when the focused input's font-size is
         under 16px. Floor every form control at 16px so focusing a
         field doesn't yank the viewport. Visual size of inline
         numeric inputs is preserved via component-level transforms
         where needed. */
      input,select,textarea{font-size:16px;}
      /* Fabrica — used for the AtmosFlow AI (Jasper) chat surface only.
         Commercial font: drop the licensed web files into
         public/fonts/ (fabrica.woff2 + fabrica.woff) and they load
         automatically. Until the files exist the browser silently
         falls back to the Inter stack in --font-jasper, so the chat
         never renders blank. font-display:swap avoids a blocking FOIT. */
      @font-face{
        font-family:'Fabrica';
        src:url('/fonts/fabrica.woff2') format('woff2'),
            url('/fonts/fabrica.woff') format('woff');
        font-weight:100 900;
        font-style:normal;
        font-display:swap;
      }
      /* Notion-style system stack with Inter as the cross-platform anchor.
         Inter is loaded below; the system fallbacks (SF Pro on iOS/Mac,
         Segoe UI on Windows, Roboto on Android) keep the app feeling
         native if Inter ever fails to load. font-feature-settings 'cv11'
         flips Inter to its single-storey 'a' which is the look the rest
         of the design language is calibrated to. */
      :root{
        --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',system-ui,ui-sans-serif,'Helvetica Neue',Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';
        /* --font-mono is now an alias for --font-sans. The v3 design
           pass moved away from a separate mono family — the system
           mono stack (SF Mono / Cascadia / Roboto Mono) was reading
           as "default code editor font" on a premium product. The
           variable name is retained for the ~70 inline call sites
           still spelling fontFamily:'var(--font-mono)'; rendering is
           Inter with tabular numerals inherited from the body rule
           below, so columns of stat values and dates still align.
           Future cleanup can migrate the call sites to var(--font-sans)
           and delete this alias. */
        --font-mono:var(--font-sans);
        /* Fabrica drives the AtmosFlow AI (Jasper) chat surface; Inter
           stack is the fallback until the licensed font files land in
           public/fonts/ (see the @font-face above). */
        --font-jasper:'Fabrica',var(--font-sans);

        /* Theme palette — dark is the default. Values match the in-app
           MobileApp.jsx constants so unmigrated components render
           identically. Components opt into theming by referencing
           var(--bg) etc. instead of inline hex literals. Light mode is
           an opt-in override under [data-theme="light"] below. */
        /* Neutral near-black ladder (UI pass, 2026-09). The previous
           #1C1B19 → #3A3834 ladder carried a warm brown cast that read as
           "charcoal"; the surfaces are now true neutrals stepping 6–7 L*
           apart, so hierarchy comes from the hairline border and the
           step itself rather than from tint or glass. */
        --bg:#0A0A0A;
        --surface:#111111;
        --card:#161616;
        /* Deep surface — the near-black used by the slide-out side menu.
           Opt-in via the BottomSheet `tone="deep"` prop for sheets that
           should read as a dark stage rather than a raised card. Flips to
           white in light mode below (mirrors the menu). */
        --surface-deep:#050505;
        --raised:#1E1E1E;
        --border:#262626;
        /* Border ladder (UI consistency pass, 2026-09). tokens.js used to
           hard-code these as white-alpha (rgba(255,255,255,.04/.07/.12)),
           which is invisible on a white page — in light mode every
           V3.panel / SettingsList group lost its edge and read as loose
           text. Subtle is for dividers inside a panel, --border for panel
           edges, strong for emphasised edges / selected tracks. */
        --border-subtle:#1C1C1C;
        --border-strong:#333333;
        /* Restrained primary cyan — darker and a touch less saturated
           than the old #22D3EE aqua, so header controls, icon outlines,
           text accents, and default active states read technical and
           premium rather than consumer-bright. The brighter --accent-fill
           below is reserved for filled-CTA / active emphasis. */
        --accent:#2EA7BF;
        --accent-dim:#1A8FA0;
        /* Text ladder is neutral grey to match the neutral surfaces — the
           previous cool-tinted greys (#ECEEF2 / #A8B0BD / #8B93A5) read
           faintly blue on a pure-neutral black. */
        --text:#F2F2F2;
        /* Supporting-label tier between --text and --sub (tokens.js
           TEXT_SECONDARY). Was a hard-coded hex in 17 call sites, so it
           never flipped for light mode. 7.8:1 on --bg, 7.2:1 on --card. */
        --text-secondary:#A3A3A3;
        --sub:#8A8A8A;
        --dim:#6B6B6B;
        --warn:#FBBF24;
        --danger:#EF4444;
        --success:#22C55E;
        /* Foreground used on top of --accent (filled accent buttons). */
        --on-accent:#07080C;
        /* Brighter cyan reserved for emphasis — filled primary CTAs and
           active/selected highlights. Toned down from the old #22D3EE
           aqua but kept a step brighter than --accent so filled buttons
           still pop. The fill itself is invariant across modes and so
           is its foreground now: near-black #07080C on #39C0D9 is
           9.26:1 (WCAG AA needs 4.5:1). The earlier white inscription
           (product direction for the dark-mode look) measured 2.16:1
           and was the audit's documented SC 1.4.3 failure; dark-on-cyan
           is also what light mode already used, so the CTA reads the
           same in both themes. */
        --accent-fill:#39C0D9;
        --on-accent-fill:#07080C;
        /* ── Liquid-glass "bubble" controls (iOS-26-style tactile buttons) ──
           Shared surface/press tokens consumed by the global .bubble-btn
           class. --bubble-bg is the fill (a control overrides it for a tint,
           e.g. the green New-project CTA); the rest define the glass border,
           the cyan tap-glow, the resting layered shadow, the inset
           specular + contact shades, and the press-down scale. Flipped for
           light mode below. */
        /* Flat controls (UI pass, 2026-09): a solid card-tone fill and a
           hairline edge, no gradient, no inset highlights, no tap-glow, no
           blur. --bubble-blur / --bubble-sheen are read by .bubble-btn in
           MobileApp.jsx and default to the old glass values when unset, so
           the class still renders the previous treatment on any page that
           does not define them. A control still tints itself by overriding
           --bubble-bg inline. */
        --bubble-bg:var(--card);
        --bubble-border:var(--border);
        --bubble-glow:transparent;
        --bubble-shadow:0 1px 2px rgba(0,0,0,0.40);
        --bubble-inset:0 0 0 0 transparent;
        --bubble-blur:none;
        --bubble-sheen:none;
        --bubble-press-scale:0.97;
      }
      [data-theme="light"]{
        /* Premium Light palette — a clean WHITE page (was a warm beige
           #F8F4EB). The surface ladder still reads: bg is pure white,
           surface is a cool-grey tier for grouped / selected areas, and
           cards stay white, lifting off the page via the neutral border +
           soft shadow rather than a bg/card tint gap. The restrained cyan
           is reserved for text, icons, and active states, and the
           brighter #39C0D9 fills emphasis CTAs. The light-mode --accent
           is a deeper cyan-700 than dark mode's #2EA7BF (which measured
           2.84:1 on white — the audit's SC 1.4.3 failure): #0C6F86 is
           5.78:1 on --bg, 4.69:1 on --surface and 5.17:1 on --raised,
           so accent text passes AA on every light surface it sits on. */
        --bg:#FFFFFF;
        /* Surface tier sits one step below a white card, not four: the
           previous #E4E8EC was a mid grey that turned every var(--surface)
           control (AI suggestion cards, composer, chips, segmented
           controls, stat tiles) into heavy slate slabs on an otherwise
           white sheet. #F3F5F7 reads as a grouped area and still sits
           visibly under a white card. */
        --surface:#F3F5F7;
        --card:#FFFFFF;
        --surface-deep:#FFFFFF;
        /* Light-mode raised surface for "selected" / "focused" rows.
           A pale cyan tint (the brand's light tint) so selected/active
           rows read as an accent highlight against pure-white cards,
           rather than the previous neutral off-white. Subtle enough to
           stay a background, not a fill. */
        --raised:#DDF7FB;
        /* Neutral cool-grey card edge (was a cyan-tinted #B6E0E8). The
           v3 Clinical-Light mockups use a clean near-neutral border so
           white cards read crisp against the cool page rather than
           cyan-outlined. Cyan still carries active/selected states via
           --accent and the pale --raised tint. */
        --border:#D6DBE1;
        --border-subtle:#E6EAEE;
        --border-strong:#C2C9D2;
        --accent:#0C6F86;
        --accent-dim:#155E75;
        --text:#0F172A;
        /* slate-700 — 10.35:1 on white, 8.41:1 on --surface. */
        --text-secondary:#334155;
        --sub:#475569;
        --dim:#5B6675;
        --on-accent:#07080C;
        /* --accent-fill (emphasis cyan) is invariant. --on-accent-fill
           stays DARK in light mode — black text on the cyan CTA is the
           correct, high-contrast pairing against a near-white page
           (dark mode flips it to white above). */
        --accent-fill:#39C0D9;
        --on-accent-fill:#07080C;
        /* Semantic colors diverge in light mode: the vivid dark-mode
           shades wash out on white (warn #FBBF24 → 1.57:1, success
           #22C55E → 2.14:1). Light mode uses darker stops from the
           same hue families so they remain legible as foreground
           text. Severity-badge helpers in component code still use
           the literal dark-mode hexes for semantic consistency. */
        --warn:#9A4A08;
        --danger:#B91C1C;
        --success:#15703A;
        /* Bubble controls flip to a near-white capsule with soft slate
           shadows (mirrors the dock / glass controls in light mode). */
        --bubble-bg:#FFFFFF;
        --bubble-border:rgba(15,23,42,0.12);
        --bubble-glow:transparent;
        --bubble-shadow:0 1px 2px rgba(15,23,42,0.08);
        --bubble-inset:0 0 0 0 transparent;
        --bubble-blur:none;
        --bubble-sheen:none;
        --bubble-press-scale:0.97;
      }
      /* The page canvas — html is what iOS paints into the safe areas and
         behind anything the app moves out of the way (the side menu slides
         the whole content surface right and scales it, exposing the canvas
         along its left edge and at the bottom). With no background here the
         UA default showed through, which under black-translucent status-bar
         styling is BLACK — a hard black strip beside a white light-mode
         menu. color-scheme is declared per theme so the UA canvas, native
         form controls and scrollbars follow the app rather than the OS. */
      :root{color-scheme:dark;}
      [data-theme="light"]{color-scheme:light;}
      html,body{background:var(--bg);min-height:100%;}
      body{
        font-family:var(--font-sans);
        /* OpenType features: cv11 = single-storey 'a' (Inter), ss03 =
           higher-contrast curves, tnum = tabular (column-aligned)
           numerals. tnum is set globally because AtmosFlow is an
           instrument-readout product — every stat strip, score, date,
           and measurement readout benefits from tabular alignment, and
           Inter's proportional vs tabular numerals are close enough
           visually that narrative copy still reads well. font-feature-
           settings inherits in CSS, so every descendant picks this up
           without needing inline declarations. */
        font-feature-settings:'cv11','ss03','tnum';
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        text-rendering:optimizeLegibility;
      }
      /* Header wordmark theme swap: the default (dark-theme) wordmark has
         white text, which is invisible on the light header. Show the
         black-text variant under [data-theme="light"]. The brain mark is
         cyan in both files, so it never disappears. !important overrides
         the inline display set on each <img>. */
      [data-theme="light"] .af-wordmark-dark{display:none!important;}
      [data-theme="light"] .af-wordmark-light{display:block!important;}
      /* Focus visibility (WCAG 2.1 SC 2.4.7). Components used to set
         outline:'none' inline — which also hid keyboard focus. Those are
         gone; instead pointer focus is quiet and keyboard focus draws a
         2px accent ring. Inline styles cannot override :focus-visible
         from here, so do not reintroduce outline:'none' in components. */
      :focus:not(:focus-visible){outline:none;}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      /* Press state (2026-09). Every control dims briefly under the finger —
         the one piece of motion that confirms a touch landed. Touch devices
         only (a hover pointer has its own feedback), and rows that are
         buttons get it as well as buttons. Nothing scales or slides. */
      @media (hover:none){
        button:active,[role="button"]:active,summary:active{opacity:.62;transition:opacity 60ms ease-out;}
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&family=Lora:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
